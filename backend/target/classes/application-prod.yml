spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/liter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret_postgres_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Security / Token signing
liter:
  jwt:
    secret: ${JWT_SECRET:super_secret_high_entropy_signing_key_32_characters_minimum}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
