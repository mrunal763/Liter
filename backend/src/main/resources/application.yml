spring:
  application:
    name: liter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/liter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:763}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      data-source-properties:
        prepareThreshold: 0
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

server:
  port: 8080

# Security / Token signing
liter:
  jwt:
    secret: ${JWT_SECRET:dev_secret_signing_key_32_characters_minimum_length_for_hmac_sha256}
    expiration-ms: ${JWT_EXPIRATION:2592000000} # 30 days (1 month)
