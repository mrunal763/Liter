spring:
  datasource:
    url: jdbc:h2:file:./data/literdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Security / Token signing
liter:
  jwt:
    secret: dev_secret_signing_key_32_characters_minimum_length_for_hmac_sha256
    expiration-ms: 86400000 # 24 hours
