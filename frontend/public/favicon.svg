<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="literGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="milkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F5E9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded Background Badge -->
  <rect width="512" height="512" rx="128" fill="url(#literGrad)" />

  <!-- Milk Bottle Icon -->
  <g filter="url(#shadow)">
    <!-- Bottle Cap -->
    <rect x="206" y="74" width="100" height="24" rx="8" fill="#A7F3D0" />
    <!-- Bottle Body -->
    <path d="M226 98 L226 136 C226 156 196 176 166 196 L166 380 C166 410 190 430 220 430 L292 430 C322 430 346 410 346 380 L346 196 C316 176 286 156 286 136 L286 98 Z" fill="url(#milkGrad)" />
    <!-- L Emblem on Bottle -->
    <path d="M232 235 L232 345 L296 345" fill="none" stroke="#2E7D32" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Fresh Milk Drop -->
    <path d="M256 150 C256 150 274 180 274 195 C274 205 266 213 256 213 C246 213 238 205 238 195 C238 180 256 150 256 150 Z" fill="#2E7D32" />
  </g>
</svg>